version: '3.9'

services:
  db:
    image: postgis/postgis
    restart: always
    container_name: geo_db
    environment:
      POSTGRES_DB: geo_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres-data: